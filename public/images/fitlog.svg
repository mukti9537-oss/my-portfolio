<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fit-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <linearGradient id="fit-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="fit-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95" />
    </linearGradient>
    <filter id="fit-glow">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#fit-bg)" />
  <circle cx="650" cy="140" r="150" fill="#8b5cf6" opacity="0.15" filter="url(#fit-glow)" />
  <circle cx="150" cy="380" r="130" fill="#ec4899" opacity="0.12" filter="url(#fit-glow)" />

  <!-- Frame -->
  <rect x="40" y="40" width="720" height="420" rx="12" fill="#0d111e" stroke="#1f2937" stroke-width="1.5" />
  <path d="M40 78 h720" stroke="#1f2937" stroke-width="1.5" />

  <circle cx="65" cy="59" r="6" fill="#ef4444" />
  <circle cx="85" cy="59" r="6" fill="#eab308" />
  <circle cx="105" cy="59" r="6" fill="#22c55e" />

  <rect x="150" y="49" width="300" height="20" rx="6" fill="#1f2937" />
  <text x="170" y="63" font-family="monospace" font-size="11" fill="#9ca3af">localhost:5173/fitlog-dashboard</text>

  <!-- FitLog UI Header -->
  <rect x="70" y="98" width="110" height="32" rx="6" fill="url(#fit-violet)" opacity="0.15" />
  <text x="85" y="120" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#a78bfa">FitLog</text>
  <text x="195" y="119" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">Workout Tracker & PR Analytics</text>

  <!-- KPI Metric Cards -->
  <!-- Metric 1 -->
  <rect x="70" y="145" width="200" height="90" rx="8" fill="url(#fit-card)" stroke="#374151" stroke-width="1" />
  <text x="90" y="172" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">Total Volume Lifted</text>
  <text x="90" y="208" font-family="system-ui, sans-serif" font-weight="800" font-size="24" fill="#f3f4f6">18,450 kg</text>
  <text x="90" y="224" font-family="system-ui, sans-serif" font-size="10" fill="#a78bfa">+12% vs last week</text>

  <!-- Metric 2 -->
  <rect x="290" y="145" width="200" height="90" rx="8" fill="url(#fit-card)" stroke="#374151" stroke-width="1" />
  <text x="310" y="172" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">Weekly Streak</text>
  <text x="310" y="208" font-family="system-ui, sans-serif" font-weight="800" font-size="24" fill="#ec4899">5 Days 🔥</text>
  <text x="310" y="224" font-family="system-ui, sans-serif" font-size="10" fill="#f472b6">Target: 5 days/wk</text>

  <!-- Metric 3 -->
  <rect x="510" y="145" width="220" height="90" rx="8" fill="url(#fit-card)" stroke="#374151" stroke-width="1" />
  <text x="530" y="172" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">New Personal Record</text>
  <text x="530" y="208" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#38bdf8">Deadlift 140 kg</text>
  <text x="530" y="224" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8">Achieved yesterday</text>

  <!-- Workout Routine Log Table -->
  <rect x="70" y="255" width="660" height="180" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1" />
  <text x="90" y="285" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#e5e7eb">Recent Routine: Push Day Hypertrophy</text>

  <!-- Rows -->
  <line x1="90" y1="300" x2="710" y2="300" stroke="#1f2937" stroke-width="1" />
  <text x="90" y="325" font-family="system-ui, sans-serif" font-size="13" fill="#f3f4f6">Barbell Bench Press</text>
  <text x="320" y="325" font-family="monospace" font-size="12" fill="#a78bfa">4 Sets × 8-10 Reps</text>
  <text x="520" y="325" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">85 kg (RPE 8.5)</text>
  <rect x="630" y="312" width="70" height="18" rx="4" fill="#8b5cf6" opacity="0.2" />
  <text x="665" y="325" font-family="system-ui, sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">Completed</text>

  <line x1="90" y1="345" x2="710" y2="345" stroke="#1f2937" stroke-width="1" />
  <text x="90" y="370" font-family="system-ui, sans-serif" font-size="13" fill="#f3f4f6">Incline Dumbbell Press</text>
  <text x="320" y="370" font-family="monospace" font-size="12" fill="#a78bfa">3 Sets × 12 Reps</text>
  <text x="520" y="370" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">30 kg/arm</text>
  <rect x="630" y="357" width="70" height="18" rx="4" fill="#8b5cf6" opacity="0.2" />
  <text x="665" y="370" font-family="system-ui, sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">Completed</text>

  <line x1="90" y1="390" x2="710" y2="390" stroke="#1f2937" stroke-width="1" />
  <text x="90" y="415" font-family="system-ui, sans-serif" font-size="13" fill="#f3f4f6">Overhead Tricep Extension</text>
  <text x="320" y="415" font-family="monospace" font-size="12" fill="#a78bfa">4 Sets × 15 Reps</text>
  <text x="520" y="415" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">Cable Stack 25 kg</text>
  <rect x="630" y="402" width="70" height="18" rx="4" fill="#8b5cf6" opacity="0.2" />
  <text x="665" y="415" font-family="system-ui, sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">Completed</text>
</svg>
