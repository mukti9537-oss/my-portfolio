<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="conf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#120e24" />
      <stop offset="100%" stop-color="#05050b" />
    </linearGradient>
    <linearGradient id="conf-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="conf-glow">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#conf-bg)" />
  <circle cx="200" cy="120" r="150" fill="#6366f1" opacity="0.15" filter="url(#conf-glow)" />
  <circle cx="650" cy="380" r="160" fill="#ec4899" opacity="0.12" filter="url(#conf-glow)" />

  <rect x="40" y="40" width="720" height="420" rx="12" fill="#0d0c18" stroke="#1f1d36" stroke-width="1.5" />
  <path d="M40 78 h720" stroke="#1f1d36" stroke-width="1.5" />

  <circle cx="65" cy="59" r="6" fill="#ef4444" />
  <circle cx="85" cy="59" r="6" fill="#eab308" />
  <circle cx="105" cy="59" r="6" fill="#22c55e" />

  <rect x="150" y="49" width="340" height="20" rx="6" fill="#1f1d36" />
  <text x="170" y="63" font-family="monospace" font-size="11" fill="#9ca3af">https://dev-conference-platform.vercel.app</text>

  <!-- Banner Hero Area -->
  <rect x="70" y="100" width="660" height="130" rx="10" fill="#15132b" stroke="#2d2955" stroke-width="1" />
  <rect x="90" y="118" width="115" height="22" rx="11" fill="url(#conf-indigo)" />
  <text x="147" y="133" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle">ANNUAL SUMMIT</text>
  
  <text x="90" y="170" font-family="system-ui, sans-serif" font-weight="800" font-size="24" fill="#f8fafc">Global Developer Conference 2026</text>
  <text x="90" y="195" font-family="system-ui, sans-serif" font-size="12" fill="#a5b4fc">3 Days • 28 Keynote Speakers • 4,000+ Engineers Worldwide</text>

  <rect x="550" y="145" width="160" height="42" rx="8" fill="url(#conf-indigo)" />
  <text x="630" y="171" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">Get Your Pass 🎟️</text>

  <!-- Speaker Cards & Schedule Snippet -->
  <text x="70" y="260" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#e2e8f0">Featured Keynote Speakers</text>

  <!-- Speaker 1 -->
  <rect x="70" y="275" width="205" height="155" rx="8" fill="#121024" stroke="#28244c" stroke-width="1" />
  <circle cx="110" cy="315" r="22" fill="#6366f1" />
  <text x="110" y="321" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">JS</text>
  <text x="145" y="312" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Sarah Lin</text>
  <text x="145" y="328" font-family="system-ui, sans-serif" font-size="11" fill="#818cf8">Staff Web Architect</text>
  <text x="85" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">"Scaling React 19 in Large Enterprise Micro-Frontends"</text>
  <rect x="85" y="390" width="85" height="18" rx="4" fill="#1e1b4b" />
  <text x="127" y="403" font-family="system-ui, sans-serif" font-size="10" fill="#a5b4fc" text-anchor="middle">10:00 AM • Hall A</text>

  <!-- Speaker 2 -->
  <rect x="295" y="275" width="205" height="155" rx="8" fill="#121024" stroke="#28244c" stroke-width="1" />
  <circle cx="335" cy="315" r="22" fill="#ec4899" />
  <text x="335" y="321" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">DB</text>
  <text x="370" y="312" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Alex Mercer</text>
  <text x="370" y="328" font-family="system-ui, sans-serif" font-size="11" fill="#f472b6">Principal DB Engineer</text>
  <text x="310" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">"Distributed Transactions & High-Throughput Node APIs"</text>
  <rect x="310" y="390" width="85" height="18" rx="4" fill="#1e1b4b" />
  <text x="352" y="403" font-family="system-ui, sans-serif" font-size="10" fill="#f472b6" text-anchor="middle">11:30 AM • Hall B</text>

  <!-- Speaker 3 -->
  <rect x="520" y="275" width="210" height="155" rx="8" fill="#121024" stroke="#28244c" stroke-width="1" />
  <circle cx="560" cy="315" r="22" fill="#06b6d4" />
  <text x="560" y="321" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">CL</text>
  <text x="595" y="312" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Maya Ahmed</text>
  <text x="595" y="328" font-family="system-ui, sans-serif" font-size="11" fill="#22d3ee">Cloud Infrastructure Lead</text>
  <text x="535" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">"Zero-Downtime Serverless Deployments & Edge Routing"</text>
  <rect x="535" y="390" width="85" height="18" rx="4" fill="#1e1b4b" />
  <text x="577" y="403" font-family="system-ui, sans-serif" font-size="10" fill="#67e8f9" text-anchor="middle">02:00 PM • Hall A</text>
</svg>
